name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Runs first so a misconfigured Pages site fails fast, before spending
      # several minutes on npm ci and a production build.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # vite.config.ts reads DEPLOY_BASE for the base path. This must match the
      # repository name; update it here if the repo is ever renamed.
      - name: Build
        run: npm run build
        env:
          DEPLOY_BASE: /${{ github.event.repository.name }}/
          # Drives canonical, Open Graph, JSON-LD @ids, sitemap.xml and
          # robots.txt. Set this to your custom domain when you own one, e.g.
          # https://lourduvasanthapolishetti.com/
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
